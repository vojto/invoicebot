name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "screenshot.png"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      CI: true
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      RAILS_ENV: test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: invoicebot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invoicebot_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.1
          cache: true

      - name: Find Ruby cache paths
        id: ruby-gems
        run: |
          echo "gems=$(mise exec -- ruby -e 'print Gem.dir')" >> "$GITHUB_OUTPUT"
          echo "bin=$(mise exec -- ruby -e 'print Gem.bindir')" >> "$GITHUB_OUTPUT"

      - name: Cache Ruby gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.ruby-gems.outputs.gems }}
            ${{ steps.ruby-gems.outputs.bin }}
          key: ${{ runner.os }}-${{ runner.arch }}-ruby-gems-v2-${{ hashFiles('.mise.toml', 'Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ruby-gems-v2-${{ hashFiles('.mise.toml') }}-

      - name: Cache npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-npm-

      - name: Install Ruby gems
        run: mise exec -- bundle install --jobs 4 --retry 3

      - name: Install JavaScript packages
        run: mise exec -- npm ci

      - name: Check TypeScript
        run: mise exec -- npm run check

      - name: Run RSpec
        run: mise exec -- bin/rails db:test:prepare && mise exec -- bundle exec rspec

      - name: Check deployment secrets
        env:
          KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NORDIGEN_SECRET_ID: ${{ secrets.NORDIGEN_SECRET_ID }}
          NORDIGEN_SECRET_KEY: ${{ secrets.NORDIGEN_SECRET_KEY }}
          KAMAL_SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
          KAMAL_SSH_KNOWN_HOSTS: ${{ secrets.KAMAL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          required_variables=(
            KAMAL_REGISTRY_USERNAME
            KAMAL_REGISTRY_PASSWORD
            RAILS_MASTER_KEY
            POSTGRES_PASSWORD
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            OPENAI_API_KEY
            NORDIGEN_SECRET_ID
            NORDIGEN_SECRET_KEY
            KAMAL_SSH_PRIVATE_KEY
            KAMAL_SSH_KNOWN_HOSTS
          )

          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing GitHub repository secret: $variable_name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          KAMAL_SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
          KAMAL_SSH_KNOWN_HOSTS: ${{ secrets.KAMAL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KAMAL_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$KAMAL_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Deploy with Kamal
        env:
          KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NORDIGEN_SECRET_ID: ${{ secrets.NORDIGEN_SECRET_ID }}
          NORDIGEN_SECRET_KEY: ${{ secrets.NORDIGEN_SECRET_KEY }}
        run: mise exec -- bin/kamal deploy

      - name: Verify production health
        run: curl --fail --show-error --silent --retry 12 --retry-delay 5 https://invoices.rinik.net/up > /dev/null

      - name: Remove SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
